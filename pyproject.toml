[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chembench"
version = "0.1.0"
description = "Leakage-aware evaluation of molecular property prediction on curated ChEMBL targets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["cheminformatics", "chembl", "rdkit", "benchmark", "activity-cliff", "qsar"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
models = ["scikit-learn>=1.3", "chemprop>=2.0", "torch>=2.2"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
chembench = "chembench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in argument defaults are fine for argparse
    "RUF001",  # unicode in scientific strings is deliberate
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
# No python_version pin: mypy follows the interpreter running it, so the
# CI matrix checks each supported version against its own dependency stubs.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]
